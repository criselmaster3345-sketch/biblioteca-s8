name: Pruebas y analisis de calidad

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    name: Pruebas y SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov

      - name: Ejecutar pruebas y generar cobertura
        run: |
          python -m pytest -v --cov=biblioteca --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Analizar codigo con SonarQube
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
